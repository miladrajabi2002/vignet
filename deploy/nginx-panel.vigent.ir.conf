# panel.vigent.ir — the dashboard host (installed PWA, push notifications).
#
# Same Next.js app as vigent.ir (the `vigent_web` upstream is declared in the
# vigent.ir site file). Middleware sends dashboard pages opened on vigent.ir
# here (PANEL_ORIGIN) and both hosts share the session cookie
# (AUTH_COOKIE_DOMAIN=.vigent.ir). See lib/auth/panel-host.ts.
#
# Install:
#   certbot certonly --nginx -d panel.vigent.ir
#   cp deploy/nginx-panel.vigent.ir.conf /etc/nginx/sites-enabled/panel.vigent.ir
#   nginx -t && systemctl reload nginx

server {
	server_name panel.vigent.ir;

	brotli on;
	brotli_comp_level 5;
	brotli_min_length 1024;
	brotli_types text/plain text/css text/xml text/x-component application/javascript application/json application/manifest+json application/xml image/svg+xml text/csv text/javascript application/rss+xml;
	gzip on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_types text/plain text/css text/xml text/x-component application/javascript application/json application/manifest+json application/xml image/svg+xml text/csv text/javascript application/rss+xml;

	# The panel is private: never indexed, the site stays the search result.
	add_header X-Robots-Tag "noindex, nofollow" always;

	# The installed app opens on the dashboard, not the marketing home page.
	location = / { return 302 /overview; }

	# The panel's own manifest: its start URL and identity are the dashboard.
	location = /site.webmanifest {
		alias /var/www/vigent.ir/public/vignet/public/panel.webmanifest;
		default_type application/manifest+json;
		add_header Cache-Control "public, max-age=3600";
		add_header X-Robots-Tag "noindex, nofollow" always;
	}

	location / {
		proxy_pass http://vigent_web;
		proxy_set_header Accept-Encoding "";
		proxy_connect_timeout 3s;
		proxy_next_upstream error timeout http_502;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 300s;
		proxy_send_timeout 300s;
	}

	listen 443 ssl http2;
	ssl_certificate /etc/letsencrypt/live/panel.vigent.ir/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/panel.vigent.ir/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
	listen 80;
	server_name panel.vigent.ir;
	return 301 https://$host$request_uri;
}
