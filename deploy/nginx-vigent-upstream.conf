# Zero-downtime deploys for vigent.ir.
#
# deploy/deploy.sh starts a temporary standby (vignet-web-standby) on :3004
# with the new build, then restarts vignet-web on :3003. While :3003 is down,
# nginx sends traffic to the backup. When nothing listens on :3004 the backup
# is simply unused.
#
# Install (once):
#   1. Put this upstream block at the top of /etc/nginx/sites-enabled/vigent.ir
#   2. In `location /` replace `proxy_pass http://127.0.0.1:3003;` with:
#        proxy_pass http://vigent_web;
#        proxy_connect_timeout 3s;
#        proxy_next_upstream error timeout;
#   3. nginx -t && systemctl reload nginx
upstream vigent_web {
	server 127.0.0.1:3003 max_fails=1 fail_timeout=5s;
	server 127.0.0.1:3004 backup;
}
