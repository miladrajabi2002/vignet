<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آفلاین — ویجنت</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #ffffff;
    color: #111827;
    display: grid;
    place-items: center;
    padding: 2rem;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .card { max-width: 26rem; }
  .icon {
    width: 4.5rem; height: 4.5rem;
    margin: 0 auto 1.25rem;
    border-radius: 1.25rem;
    background: #f3f4f6;
    display: grid;
    place-items: center;
  }
  .icon svg { width: 2rem; height: 2rem; stroke: #6b7280; }
  h1 { font-size: 1.25rem; font-weight: 800; margin-bottom: .625rem; }
  p { font-size: .9375rem; line-height: 1.9; color: #4b5563; margin-bottom: 1.75rem; }
  button {
    min-height: 3rem;
    padding: 0 1.75rem;
    border: 0;
    border-radius: .875rem;
    background: #111827;
    color: #ffffff;
    font-size: .9375rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 8v4"/>
        <path d="M12 16h.01"/>
        <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
      </svg>
    </div>
    <h1>اتصال اینترنت قطع شد</h1>
    <p>ویجنت برای نمایش داشبورد و گفتگوها به اینترنت نیاز دارد. اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
  </main>
</body>
</html>
